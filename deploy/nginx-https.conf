server {
    listen 80;
    listen [::]:80;
    server_name lifewithlabr.ru www.lifewithlabr.ru admin.lifewithlabr.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/lifewithlabr-acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lifewithlabr.ru www.lifewithlabr.ru admin.lifewithlabr.ru;
    ssl_certificate /etc/letsencrypt/live/lifewithlabr.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifewithlabr.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 13m;
    add_header Strict-Transport-Security "max-age=86400" always;
    if ($host = www.lifewithlabr.ru) { return 308 https://lifewithlabr.ru$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
