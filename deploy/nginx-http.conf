server {
    listen 80;
    listen [::]:80;
    server_name lifewithlabr.ru www.lifewithlabr.ru admin.lifewithlabr.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/lifewithlabr-acme; }
    location / {
        # Only the public site is served until the HTTPS certificate is issued.
        if ($host = admin.lifewithlabr.ru) { return 503; }
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
